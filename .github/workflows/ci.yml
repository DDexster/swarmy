name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Sources stay LF on Windows too (.gitattributes says so as well): the architecture tests
      # read them as text.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      # Unit and scenario tests, and the architecture ratchets (tests/architecture.rs).
      - run: cargo test --locked --no-fail-fast

  static-linux:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: cargo-zigbuild@0.24.0
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo zigbuild --locked --release --target x86_64-unknown-linux-musl
      - run: tools/dist.sh check-static target/x86_64-unknown-linux-musl/release/swarmy
      - run: target/x86_64-unknown-linux-musl/release/swarmy --version
