[package]
name = "agentmana"
version = "0.1.0"
edition = "2024"
authors = ["Viktor Turskyi"]
description = "Mission control for Claude Code agents: live swarm view, API-equivalent spend, weekly-limit attribution by project, and a vault for OAuth logins"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["claude", "agents", "tui", "monitoring", "usage"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[features]
default = ["bundled-sqlite"]
# Distributions that ship a system libsqlite3 can build with --no-default-features.
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
crossterm = "0.29.0"
directories = "6.0.0"
hex = "0.4.3"
owo-colors = "4.4.0"
ratatui = "0.30.2"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", default-features = false, features = ["cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "preserve_order"] }
sha2 = "0.11.1"
sysinfo = "0.40.4"
thiserror = "2.0.21"
toml = "1.0.0"
unicode-width = "0.2.3"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
